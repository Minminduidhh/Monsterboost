<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Boost</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
}

/* HEADER */
header {
  background: #020617;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  border-bottom: 1px solid #1e293b;
}

/* CONTAINER */
.container {
  padding: 20px;
}

/* CARD */
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

/* INPUT */
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  background: #0f172a;
  color: white;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(45deg,#3b82f6,#9333ea);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

/* NAVBAR */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #020617;
  padding: 10px;
}

.nav button {
  background: none;
  width: auto;
}

/* HIDE */
.hidden {
  display: none;
}
</style>
</head>

<body>

<header>🚀 Monster Boost</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
  <h3>Login</h3>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="card">
    <h3>Dashboard</h3>
    <p>Balance: <b>$10.00</b></p>
  </div>

  <!-- ORDER -->
  <div id="orderPage" class="card">
    <h3>New Order</h3>

    <select id="service">
      <option>Instagram Followers</option>
      <option>TikTok Likes</option>
      <option>YouTube Views</option>
    </select>

    <input id="link" placeholder="Enter Link">
    <input id="qty" placeholder="Quantity">

    <button onclick="submitOrder()">Submit Order</button>
  </div>

  <!-- HISTORY -->
  <div id="historyPage" class="card hidden">
    <h3>Order History</h3>
    <p id="historyText">No orders yet</p>
  </div>

</div>

</div>

<!-- NAV -->
<div class="nav hidden" id="nav">
  <button onclick="showPage('order')">🛒 Order</button>
  <button onclick="showPage('history')">📦 Orders</button>
</div>

<script>
function login(){
  let user = document.getElementById("username").value;
  if(user == ""){
    alert("Enter username");
    return;
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("nav").classList.remove("hidden");
}

function showPage(page){
  document.getElementById("orderPage").classList.add("hidden");
  document.getElementById("historyPage").classList.add("hidden");

  if(page === "order"){
    document.getElementById("orderPage").classList.remove("hidden");
  } else {
    document.getElementById("historyPage").classList.remove("hidden");
  }
}

function submitOrder(){
  let service = document.getElementById("service").value;
  let link = document.getElementById("link").value;
  let qty = document.getElementById("qty").value;

  if(!link || !qty){
    alert("Fill all fields");
    return;
  }

  document.getElementById("historyText").innerText =
    "Service: " + service + "\nLink: " + link + "\nQty: " + qty;
}
</script>

</body>
</html>
