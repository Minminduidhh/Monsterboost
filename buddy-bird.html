<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Buddy Bird</title>
<style>
/* ===== Global Styles ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== Canvas Container ===== */
#gameWrapper {
  position: relative;
  width: 400px;
  height: 600px;
}

canvas {
  display: block;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

/* ===== Shop Overlay ===== */
#shopOverlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 400px; height: 600px;
  background: rgba(0, 0, 0, 0.92);
  border-radius: 12px;
  z-index: 10;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px;
  overflow-y: auto;
}

#shopOverlay.active { display: flex; }

#shopOverlay h2 {
  color: #ffd700;
  font-size: 28px;
  margin-bottom: 8px;
  text-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
}

.shop-coins {
  color: #ffd700;
  font-size: 18px;
  margin-bottom: 20px;
}

/* ===== Shop Item Grid ===== */
.shop-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  padding: 0 5px;
}

.shop-item {
  background: #1e293b;
  border: 2px solid #334155;
  border-radius: 12px;
  padding: 16px 10px;
  text-align: center;
  transition: transform 0.15s, border-color 0.15s;
  cursor: pointer;
}

.shop-item:hover { transform: scale(1.04); border-color: #60a5fa; }
.shop-item.owned { border-color: #22c55e; }
.shop-item.selected { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.3); }

.bird-preview {
  width: 48px; height: 48px;
  border-radius: 50%;
  margin: 0 auto 10px;
  position: relative;
}

.shop-item .name {
  color: #e2e8f0;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}

.shop-item .price {
  color: #ffd700;
  font-size: 13px;
}

.shop-item .status {
  font-size: 12px;
  margin-top: 4px;
}

.status.owned-text { color: #22c55e; }
.status.equipped-text { color: #ffd700; }

/* ===== Shop Buttons ===== */
.shop-btn {
  margin-top: 20px;
  padding: 12px 36px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: opacity 0.15s;
}

.shop-btn:hover { opacity: 0.85; }

#closeShopBtn {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
}

/* ===== Responsive ===== */
@media (max-width: 420px) {
  #gameWrapper { width: 100vw; height: 100vh; }
  canvas { border-radius: 0; width: 100vw; height: 100vh; }
  #shopOverlay { width: 100vw; height: 100vh; border-radius: 0; }
}
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <!-- ===== Shop UI Overlay ===== -->
  <div id="shopOverlay">
    <h2>🏪 Shop</h2>
    <div class="shop-coins">Coins: <span id="shopCoinDisplay">0</span></div>
    <div class="shop-grid" id="shopGrid"></div>
    <button class="shop-btn" id="closeShopBtn">Close</button>
  </div>
</div>

<script>
// ============================================================
// Buddy Bird - Angry Bird Style Flappy Game
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ===== Game States =====
const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
let gameState = STATE.MENU;

// ===== Bird Skins (Angry Bird Style) =====
const BIRD_SKINS = [
  { id: 'default',  name: 'Red Angry',    body: '#ef4444', belly: '#fbbf24', brow: '#8b0000', beak: '#ff8c00', price: 0 },
  { id: 'blue',     name: 'Blue Angry',   body: '#3b82f6', belly: '#93c5fd', brow: '#1e3a5f', beak: '#f97316', price: 15 },
  { id: 'yellow',   name: 'Yellow Angry',  body: '#facc15', belly: '#fef9c3', brow: '#854d0e', beak: '#ea580c', price: 20 },
  { id: 'green',    name: 'Green Angry',   body: '#22c55e', belly: '#bbf7d0', brow: '#14532d', beak: '#f97316', price: 25 },
  { id: 'pink',     name: 'Pink Angry',    body: '#ec4899', belly: '#fbcfe8', brow: '#831843', beak: '#f97316', price: 30 },
  { id: 'purple',   name: 'Purple Angry',  body: '#a855f7', belly: '#e9d5ff', brow: '#581c87', beak: '#fb923c', price: 40 },
  { id: 'orange',   name: 'Orange Angry',  body: '#f97316', belly: '#fed7aa', brow: '#7c2d12', beak: '#dc2626', price: 45 },
  { id: 'cyan',     name: 'Ice Angry',     body: '#06b6d4', belly: '#a5f3fc', brow: '#164e63', beak: '#f97316', price: 55 },
  { id: 'gold',     name: 'Golden Angry',  body: '#fbbf24', belly: '#fef3c7', brow: '#78350f', beak: '#dc2626', price: 70 },
  { id: 'black',    name: 'Black Angry',   body: '#1e1e1e', belly: '#4b5563', brow: '#000000', beak: '#f97316', price: 80 },
  { id: 'rainbow',  name: 'Rainbow Angry', body: '#ff6b6b', belly: '#ffe66d', brow: '#4ecdc4', beak: '#ff8c00', price: 99 },
];

// ===== Persistent Data =====
let totalCoins = 0;
let ownedSkins = ['default'];
let equippedSkin = 'default';
let highScore = 0;

function loadSaveData() {
  try {
    const data = JSON.parse(localStorage.getItem('buddyBirdSave'));
    if (data) {
      totalCoins = data.coins || 0;
      ownedSkins = data.owned || ['default'];
      equippedSkin = data.equipped || 'default';
      highScore = data.highScore || 0;
    }
  } catch(e) {
    totalCoins = 0;
    ownedSkins = ['default'];
    equippedSkin = 'default';
    highScore = 0;
  }
}

function saveSaveData() {
  localStorage.setItem('buddyBirdSave', JSON.stringify({
    coins: totalCoins,
    owned: ownedSkins,
    equipped: equippedSkin,
    highScore: highScore
  }));
}

// ===== Game Variables =====
let bird, pipes, coins, score, coinCount, frameCount;
let bgOffset = 0;
let groundOffset = 0;
let currentWorld = 1; // 1 = normal, 2 = purple/dark world

// ===== Physics Constants =====
const GRAVITY = 0.45;
const FLAP_POWER = -7.5;
const PIPE_SPEED = 2.5;
const PIPE_GAP = 150;
const PIPE_WIDTH = 60;
const PIPE_INTERVAL = 100;

function createBird() {
  return {
    x: 80, y: H / 2,
    w: 38, h: 38,
    vy: 0, rotation: 0, flapFrame: 0
  };
}

function resetGame() {
  bird = createBird();
  pipes = [];
  coins = [];
  score = 0;
  coinCount = 0;
  frameCount = 0;
  currentWorld = 1;
}

// ===== Pipe & Coin Spawning =====
function spawnPipe() {
  const minY = 80;
  const maxY = H - 140 - PIPE_GAP;
  const gapTop = minY + Math.random() * (maxY - minY);
  pipes.push({ x: W + 10, gapTop, gapBottom: gapTop + PIPE_GAP, scored: false });
  if (Math.random() < 0.7) {
    coins.push({
      x: W + 10 + PIPE_WIDTH / 2,
      y: gapTop + PIPE_GAP / 2 + (Math.random() - 0.5) * 40,
      r: 12, collected: false,
      bobOffset: Math.random() * Math.PI * 2
    });
  }
}

// ===== Collision Detection =====
function checkCollision() {
  if (bird.y + bird.h / 2 >= H - 80) return true;
  if (bird.y - bird.h / 2 <= 0) return true;
  for (let p of pipes) {
    if (bird.x + bird.w / 2 > p.x && bird.x - bird.w / 2 < p.x + PIPE_WIDTH) {
      if (bird.y - bird.h / 2 < p.gapTop || bird.y + bird.h / 2 > p.gapBottom) return true;
    }
  }
  return false;
}

function checkCoinCollection() {
  for (let c of coins) {
    if (c.collected) continue;
    const dist = Math.sqrt((bird.x - c.x) ** 2 + (bird.y - c.y) ** 2);
    if (dist < c.r + 16) { c.collected = true; coinCount++; totalCoins++; }
  }
}

function getCurrentSkin() {
  return BIRD_SKINS.find(s => s.id === equippedSkin) || BIRD_SKINS[0];
}

// ============================================================
// DRAWING FUNCTIONS
// ============================================================

// ===== Draw Background (World 1: Day, World 2: Purple/Night) =====
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  if (currentWorld === 2) {
    // Purple/dark night world
    grad.addColorStop(0, '#2d1b69');
    grad.addColorStop(0.4, '#4c1d95');
    grad.addColorStop(0.7, '#581c87');
    grad.addColorStop(1, '#3b0764');
  } else {
    // Normal day world
    grad.addColorStop(0, '#87CEEB');
    grad.addColorStop(0.6, '#E0F7FA');
    grad.addColorStop(1, '#81C784');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  if (currentWorld === 2) {
    ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
  } else {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  }
  for (let i = 0; i < 5; i++) {
    const cx = ((i * 120 + 50) - bgOffset * 0.3) % (W + 100) - 50;
    const cy = 60 + i * 45;
    drawCloud(cx, cy, 30 + i * 5);
  }

  // Stars in night world
  if (currentWorld === 2) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    for (let i = 0; i < 20; i++) {
      const sx = (i * 73 + 10 + bgOffset * 0.1) % W;
      const sy = (i * 37 + 15) % (H - 200);
      const sr = 1 + (i % 3);
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Hills
  ctx.fillStyle = currentWorld === 2 ? '#4a1d8e' : '#66BB6A';
  ctx.beginPath();
  ctx.moveTo(0, H - 80);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, H - 100 - Math.sin((x + bgOffset * 0.2) * 0.02) * 25);
  }
  ctx.lineTo(W, H - 80);
  ctx.closePath();
  ctx.fill();
}

function drawCloud(x, y, size) {
  ctx.beginPath();
  ctx.arc(x, y, size * 0.6, 0, Math.PI * 2);
  ctx.arc(x + size * 0.5, y - size * 0.2, size * 0.5, 0, Math.PI * 2);
  ctx.arc(x + size, y, size * 0.55, 0, Math.PI * 2);
  ctx.arc(x + size * 0.5, y + size * 0.1, size * 0.45, 0, Math.PI * 2);
  ctx.fill();
}

// ===== Draw Ground =====
function drawGround() {
  if (currentWorld === 2) {
    ctx.fillStyle = '#2d1050';
    ctx.fillRect(0, H - 80, W, 80);
    ctx.fillStyle = '#7c3aed';
    ctx.fillRect(0, H - 80, W, 16);
    ctx.strokeStyle = '#6d28d9';
  } else {
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, H - 80, W, 80);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(0, H - 80, W, 16);
    ctx.strokeStyle = '#388E3C';
  }
  ctx.lineWidth = 2;
  for (let x = -groundOffset % 20; x < W; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, H - 80); ctx.lineTo(x + 6, H - 90); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 10, H - 80); ctx.lineTo(x + 16, H - 86); ctx.stroke();
  }
}

// ===== Draw Angry Bird =====
function drawBird() {
  const skin = getCurrentSkin();
  const isRainbow = skin.id === 'rainbow';
  ctx.save();
  ctx.translate(bird.x, bird.y);
  bird.rotation = Math.min(Math.max(bird.vy * 3, -30), 70);
  ctx.rotate(bird.rotation * Math.PI / 180);

  const R = bird.w / 2; // radius

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(2, 3, R, R * 0.95, 0, 0, Math.PI * 2);
  ctx.fill();

  // Main body (round)
  if (isRainbow) {
    // Rainbow gradient body
    const rbGrad = ctx.createLinearGradient(-R, -R, R, R);
    rbGrad.addColorStop(0, '#ff6b6b');
    rbGrad.addColorStop(0.2, '#feca57');
    rbGrad.addColorStop(0.4, '#48dbfb');
    rbGrad.addColorStop(0.6, '#ff9ff3');
    rbGrad.addColorStop(0.8, '#54a0ff');
    rbGrad.addColorStop(1, '#5f27cd');
    ctx.fillStyle = rbGrad;
  } else {
    ctx.fillStyle = skin.body;
  }
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Belly (lighter oval at bottom)
  ctx.fillStyle = isRainbow ? '#ffe66d' : skin.belly;
  ctx.beginPath();
  ctx.ellipse(0, R * 0.3, R * 0.6, R * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head feathers (two triangular tufts on top)
  ctx.fillStyle = isRainbow ? '#4ecdc4' : skin.body;
  ctx.beginPath();
  ctx.moveTo(-4, -R + 2);
  ctx.lineTo(-2, -R - 10);
  ctx.lineTo(2, -R + 3);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(3, -R + 1);
  ctx.lineTo(6, -R - 8);
  ctx.lineTo(9, -R + 3);
  ctx.closePath();
  ctx.fill();

  // Eyes (two white circles)
  // Left eye
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-5, -4, 6, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
  // Right eye
  ctx.beginPath();
  ctx.ellipse(6, -4, 6, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Pupils (looking forward)
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(-3, -3, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(8, -3, 3, 0, Math.PI * 2);
  ctx.fill();

  // Pupil highlights
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-4, -5, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(7, -5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Angry eyebrows (V-shaped, thick)
  ctx.strokeStyle = isRainbow ? '#2d3436' : skin.brow;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  // Left eyebrow (angled down-inward)
  ctx.beginPath();
  ctx.moveTo(-13, -10);
  ctx.lineTo(-3, -8);
  ctx.stroke();
  // Right eyebrow (angled down-inward)
  ctx.beginPath();
  ctx.moveTo(14, -10);
  ctx.lineTo(4, -8);
  ctx.stroke();

  // Beak (triangular, chunky — Angry Bird style)
  ctx.fillStyle = skin.beak;
  // Top beak
  ctx.beginPath();
  ctx.moveTo(4, 1);
  ctx.lineTo(22, 0);
  ctx.lineTo(4, 5);
  ctx.closePath();
  ctx.fill();
  // Bottom beak (smaller)
  ctx.fillStyle = isRainbow ? '#e17055' : darkenColor(skin.beak, 30);
  ctx.beginPath();
  ctx.moveTo(4, 5);
  ctx.lineTo(18, 5);
  ctx.lineTo(4, 10);
  ctx.closePath();
  ctx.fill();

  // Tail feathers (back)
  ctx.fillStyle = isRainbow ? '#6c5ce7' : darkenColor(skin.body, 20);
  ctx.beginPath();
  ctx.moveTo(-R + 2, -3);
  ctx.lineTo(-R - 10, -8);
  ctx.lineTo(-R - 8, 0);
  ctx.lineTo(-R - 11, 5);
  ctx.lineTo(-R + 2, 3);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// Helper: darken a hex color
function darkenColor(hex, amount) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.max(0, r - amount);
  g = Math.max(0, g - amount);
  b = Math.max(0, b - amount);
  return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
}

// ===== Draw Pipes =====
function drawPipes() {
  for (let p of pipes) {
    let pipeColor1, pipeColor2, capColor, capStroke;
    if (currentWorld === 2) {
      pipeColor1 = '#5b21b6'; pipeColor2 = '#7c3aed';
      capColor = '#6d28d9'; capStroke = '#4c1d95';
    } else {
      pipeColor1 = '#2E7D32'; pipeColor2 = '#4CAF50';
      capColor = '#388E3C'; capStroke = '#1B5E20';
    }
    const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
    pipeGrad.addColorStop(0, pipeColor1);
    pipeGrad.addColorStop(0.5, pipeColor2);
    pipeGrad.addColorStop(1, pipeColor1);

    // Top pipe
    ctx.fillStyle = pipeGrad;
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.gapTop);
    ctx.fillStyle = capColor;
    ctx.fillRect(p.x - 4, p.gapTop - 24, PIPE_WIDTH + 8, 24);
    ctx.strokeStyle = capStroke;
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - 4, p.gapTop - 24, PIPE_WIDTH + 8, 24);

    // Bottom pipe
    ctx.fillStyle = pipeGrad;
    ctx.fillRect(p.x, p.gapBottom, PIPE_WIDTH, H - p.gapBottom);
    ctx.fillStyle = capColor;
    ctx.fillRect(p.x - 4, p.gapBottom, PIPE_WIDTH + 8, 24);
    ctx.strokeStyle = capStroke;
    ctx.strokeRect(p.x - 4, p.gapBottom, PIPE_WIDTH + 8, 24);

    // Highlights
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(p.x + 4, 0, 8, p.gapTop);
    ctx.fillRect(p.x + 4, p.gapBottom, 8, H - p.gapBottom);
  }
}

// ===== Draw Coins =====
function drawCoins() {
  for (let c of coins) {
    if (c.collected) continue;
    const bobY = Math.sin(frameCount * 0.06 + c.bobOffset) * 4;
    ctx.save();
    ctx.translate(c.x, c.y + bobY);
    ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
    ctx.beginPath(); ctx.arc(0, 0, c.r + 5, 0, Math.PI * 2); ctx.fill();
    const coinGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, c.r);
    coinGrad.addColorStop(0, '#FFF176');
    coinGrad.addColorStop(0.7, '#FFD700');
    coinGrad.addColorStop(1, '#FFA000');
    ctx.fillStyle = coinGrad;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#E65100'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#B8860B';
    ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 0);
    ctx.restore();
  }
}

// ===== Draw HUD =====
function drawHUD() {
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 4;
  ctx.font = 'bold 40px Arial'; ctx.textAlign = 'center';
  ctx.strokeText(score, W / 2, 55); ctx.fillText(score, W / 2, 55);

  // Coin icon + count
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(28, 28, 10, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#B8860B'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
  ctx.fillText('$', 28, 29);
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 3;
  ctx.font = 'bold 18px Arial'; ctx.textAlign = 'left';
  ctx.strokeText(totalCoins, 44, 33); ctx.fillText(totalCoins, 44, 33);

  // World indicator
  if (currentWorld === 2) {
    ctx.fillStyle = '#c084fc'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'right';
    ctx.fillText('WORLD 2', W - 15, 25);
  }
}

// ===== Draw Menu Screen =====
function drawMenu() {
  // Use world 1 background for menu
  const savedWorld = currentWorld;
  currentWorld = 1;
  drawBackground();
  drawGround();
  currentWorld = savedWorld;

  // Floating angry bird animation
  const menuBirdY = H / 2.5 + Math.sin(Date.now() * 0.003) * 15;
  const origY = bird.y;
  const origX = bird.x;
  bird.y = menuBirdY;
  bird.x = W / 2;
  bird.flapFrame = Date.now() * 0.01;
  bird.vy = 0;
  drawBird();
  bird.y = origY;
  bird.x = origX;

  // Title
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 6;
  ctx.font = 'bold 44px Arial'; ctx.textAlign = 'center';
  ctx.strokeText('Buddy Bird', W / 2, 85);
  ctx.fillText('Buddy Bird', W / 2, 85);

  // High score
  if (highScore > 0) {
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 18px Arial';
    ctx.fillText('Best: ' + highScore, W / 2, H / 2 + 50);
  }

  // Coins display
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 16px Arial';
  ctx.fillText('Coins: ' + totalCoins, W / 2, H / 2 + 80);

  // ===== Bottom Menu Buttons (Play & Shop boxes) =====
  drawMenuButtons();
}

// ===== Menu Buttons: Play & Shop =====
const BTN_Y = H - 145;
const BTN_W = 150;
const BTN_H = 60;
const PLAY_BTN = { x: W / 2 - BTN_W - 10, y: BTN_Y, w: BTN_W, h: BTN_H };
const SHOP_BTN = { x: W / 2 + 10, y: BTN_Y, w: BTN_W, h: BTN_H };

function drawMenuButtons() {
  // Play button
  drawMenuBox(PLAY_BTN.x, PLAY_BTN.y, PLAY_BTN.w, PLAY_BTN.h, '#27ae60', '#2ecc71');
  // Play icon (triangle)
  ctx.fillStyle = '#ffffff';
  const px = PLAY_BTN.x + PLAY_BTN.w / 2;
  const py = PLAY_BTN.y + BTN_H / 2 - 6;
  ctx.beginPath();
  ctx.moveTo(px - 8, py - 10);
  ctx.lineTo(px + 10, py);
  ctx.lineTo(px - 8, py + 10);
  ctx.closePath();
  ctx.fill();
  // Play text
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('ဆော့ရန်', px, PLAY_BTN.y + BTN_H - 8);

  // Shop button
  drawMenuBox(SHOP_BTN.x, SHOP_BTN.y, SHOP_BTN.w, SHOP_BTN.h, '#8e44ad', '#9b59b6');
  // Shop icon (simple storefront)
  const sx = SHOP_BTN.x + SHOP_BTN.w / 2;
  const sy = SHOP_BTN.y + BTN_H / 2 - 6;
  ctx.fillStyle = '#ffffff';
  // Roof
  ctx.beginPath();
  ctx.moveTo(sx - 12, sy - 2);
  ctx.lineTo(sx, sy - 12);
  ctx.lineTo(sx + 12, sy - 2);
  ctx.closePath();
  ctx.fill();
  // Store body
  ctx.fillRect(sx - 10, sy - 2, 20, 14);
  // Door
  ctx.fillStyle = '#8e44ad';
  ctx.fillRect(sx - 4, sy + 3, 8, 9);
  // Shop text
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('ဝယ်ယူရန်', sx, SHOP_BTN.y + BTN_H - 8);
}

function drawMenuBox(x, y, w, h, color1, color2) {
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, color2);
  grad.addColorStop(1, color1);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Inner shadow/glow
  ctx.shadowColor = 'rgba(0,0,0,0.2)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetY = 2;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
}

// ===== Draw Game Over =====
function drawGameOver() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);

  const px = W / 2 - 130, py = H / 2 - 110, pw = 260, ph = 220;
  ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 16); ctx.fill();
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#ef4444'; ctx.font = 'bold 34px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Game Over', W / 2, py + 48);

  ctx.fillStyle = '#ffffff'; ctx.font = '20px Arial';
  ctx.fillText('Score: ' + score, W / 2, py + 85);

  ctx.fillStyle = '#FFD700'; ctx.font = '18px Arial';
  ctx.fillText('Coins: +' + coinCount, W / 2, py + 115);

  ctx.fillStyle = '#94a3b8'; ctx.font = '16px Arial';
  ctx.fillText('Best: ' + highScore, W / 2, py + 145);

  ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(Date.now() * 0.004) * 0.4) + ')';
  ctx.font = '16px Arial';
  ctx.fillText('Tap to Restart', W / 2, py + 190);
}

// ============================================================
// GAME LOGIC
// ============================================================

function update() {
  if (gameState !== STATE.PLAYING) return;
  frameCount++;
  bgOffset += PIPE_SPEED * 0.5;
  groundOffset += PIPE_SPEED;

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.flapFrame++;

  // Check world change at score 20
  if (score >= 20) {
    currentWorld = 2;
  }

  if (frameCount % PIPE_INTERVAL === 0) spawnPipe();

  for (let p of pipes) {
    p.x -= PIPE_SPEED;
    if (!p.scored && p.x + PIPE_WIDTH < bird.x) { p.scored = true; score++; }
  }
  for (let c of coins) c.x -= PIPE_SPEED;

  pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
  coins = coins.filter(c => c.x > -30 && !c.collected);

  checkCoinCollection();

  if (checkCollision()) {
    gameState = STATE.GAMEOVER;
    if (score > highScore) highScore = score;
    saveSaveData();
  }
}

// ===== Main Game Loop =====
function gameLoop() {
  update();
  if (gameState === STATE.MENU) {
    drawMenu();
  } else if (gameState === STATE.PLAYING) {
    drawBackground();
    drawPipes();
    drawCoins();
    drawGround();
    drawBird();
    drawHUD();
  } else if (gameState === STATE.GAMEOVER) {
    drawBackground();
    drawPipes();
    drawCoins();
    drawGround();
    drawBird();
    drawHUD();
    drawGameOver();
  }
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT HANDLING (no dimming — using touchstart + preventDefault)
// ============================================================

function flap() {
  if (gameState === STATE.PLAYING) bird.vy = FLAP_POWER;
}

// Prevent default touch behavior that causes dimming/highlight
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  e.preventDefault();
  handleInput(e.clientX, e.clientY);
});

function handleInput(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (clientX - rect.left) * scaleX;
  const my = (clientY - rect.top) * scaleY;

  if (gameState === STATE.MENU) {
    // Check Play button
    if (mx >= PLAY_BTN.x && mx <= PLAY_BTN.x + PLAY_BTN.w &&
        my >= PLAY_BTN.y && my <= PLAY_BTN.y + PLAY_BTN.h) {
      resetGame();
      gameState = STATE.PLAYING;
      return;
    }
    // Check Shop button
    if (mx >= SHOP_BTN.x && mx <= SHOP_BTN.x + SHOP_BTN.w &&
        my >= SHOP_BTN.y && my <= SHOP_BTN.y + SHOP_BTN.h) {
      openShop();
      return;
    }
  } else if (gameState === STATE.PLAYING) {
    flap();
  } else if (gameState === STATE.GAMEOVER) {
    gameState = STATE.MENU;
  }
}

// Keyboard support
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameState === STATE.PLAYING) flap();
    else if (gameState === STATE.MENU) { resetGame(); gameState = STATE.PLAYING; }
    else if (gameState === STATE.GAMEOVER) gameState = STATE.MENU;
  }
});

// ============================================================
// SHOP SYSTEM
// ============================================================

const shopOverlay = document.getElementById('shopOverlay');
const shopGrid = document.getElementById('shopGrid');
const shopCoinDisplay = document.getElementById('shopCoinDisplay');
const closeShopBtn = document.getElementById('closeShopBtn');

function openShop() {
  shopCoinDisplay.textContent = totalCoins;
  renderShopItems();
  shopOverlay.classList.add('active');
}

function closeShop() { shopOverlay.classList.remove('active'); }
closeShopBtn.addEventListener('click', closeShop);

function renderShopItems() {
  shopGrid.innerHTML = '';
  BIRD_SKINS.forEach(skin => {
    const item = document.createElement('div');
    item.className = 'shop-item';
    const isOwned = ownedSkins.includes(skin.id);
    const isEquipped = equippedSkin === skin.id;
    if (isEquipped) item.classList.add('selected');
    else if (isOwned) item.classList.add('owned');

    // Create mini angry bird preview using a small canvas
    const previewCanvas = document.createElement('canvas');
    previewCanvas.width = 48; previewCanvas.height = 48;
    previewCanvas.style.margin = '0 auto 10px';
    previewCanvas.style.display = 'block';
    previewCanvas.style.borderRadius = '50%';
    const pctx = previewCanvas.getContext('2d');
    drawMiniBird(pctx, 24, 24, 18, skin);

    const nameDiv = document.createElement('div');
    nameDiv.className = 'name';
    nameDiv.textContent = skin.name;

    const statusDiv = document.createElement('div');
    if (isEquipped) {
      statusDiv.className = 'status equipped-text';
      statusDiv.textContent = 'Equipped';
    } else if (isOwned) {
      statusDiv.className = 'status owned-text';
      statusDiv.textContent = 'Owned';
    } else {
      statusDiv.className = 'price';
      statusDiv.textContent = skin.price + ' Coins';
    }

    item.appendChild(previewCanvas);
    item.appendChild(nameDiv);
    item.appendChild(statusDiv);

    item.addEventListener('click', () => {
      if (isEquipped) return;
      if (isOwned) {
        equippedSkin = skin.id;
        saveSaveData();
        renderShopItems();
      } else if (totalCoins >= skin.price) {
        totalCoins -= skin.price;
        ownedSkins.push(skin.id);
        equippedSkin = skin.id;
        saveSaveData();
        shopCoinDisplay.textContent = totalCoins;
        renderShopItems();
      } else {
        item.style.borderColor = '#ef4444';
        setTimeout(() => { item.style.borderColor = ''; }, 500);
      }
    });
    shopGrid.appendChild(item);
  });
}

// Draw a mini angry bird for shop preview
function drawMiniBird(pctx, cx, cy, r, skin) {
  const isRainbow = skin.id === 'rainbow';

  // Body
  if (isRainbow) {
    const rbGrad = pctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    rbGrad.addColorStop(0, '#ff6b6b');
    rbGrad.addColorStop(0.3, '#feca57');
    rbGrad.addColorStop(0.6, '#48dbfb');
    rbGrad.addColorStop(1, '#5f27cd');
    pctx.fillStyle = rbGrad;
  } else {
    pctx.fillStyle = skin.body;
  }
  pctx.beginPath(); pctx.arc(cx, cy, r, 0, Math.PI * 2); pctx.fill();
  pctx.strokeStyle = 'rgba(0,0,0,0.2)'; pctx.lineWidth = 1; pctx.stroke();

  // Belly
  pctx.fillStyle = isRainbow ? '#ffe66d' : skin.belly;
  pctx.beginPath(); pctx.ellipse(cx, cy + r * 0.3, r * 0.55, r * 0.4, 0, 0, Math.PI * 2); pctx.fill();

  // Head feathers
  pctx.fillStyle = isRainbow ? '#4ecdc4' : skin.body;
  pctx.beginPath(); pctx.moveTo(cx - 2, cy - r + 1); pctx.lineTo(cx, cy - r - 5); pctx.lineTo(cx + 2, cy - r + 1); pctx.fill();
  pctx.beginPath(); pctx.moveTo(cx + 2, cy - r + 1); pctx.lineTo(cx + 4, cy - r - 4); pctx.lineTo(cx + 6, cy - r + 1); pctx.fill();

  // Eyes
  pctx.fillStyle = '#fff';
  pctx.beginPath(); pctx.ellipse(cx - 3, cy - 2, 4, 4.5, 0, 0, Math.PI * 2); pctx.fill();
  pctx.beginPath(); pctx.ellipse(cx + 4, cy - 2, 4, 4.5, 0, 0, Math.PI * 2); pctx.fill();
  // Pupils
  pctx.fillStyle = '#1a1a1a';
  pctx.beginPath(); pctx.arc(cx - 2, cy - 1, 2, 0, Math.PI * 2); pctx.fill();
  pctx.beginPath(); pctx.arc(cx + 5, cy - 1, 2, 0, Math.PI * 2); pctx.fill();

  // Eyebrows
  pctx.strokeStyle = isRainbow ? '#2d3436' : skin.brow;
  pctx.lineWidth = 2; pctx.lineCap = 'round';
  pctx.beginPath(); pctx.moveTo(cx - 8, cy - 6); pctx.lineTo(cx - 2, cy - 5); pctx.stroke();
  pctx.beginPath(); pctx.moveTo(cx + 9, cy - 6); pctx.lineTo(cx + 3, cy - 5); pctx.stroke();

  // Beak
  pctx.fillStyle = skin.beak;
  pctx.beginPath(); pctx.moveTo(cx + 3, cy + 1); pctx.lineTo(cx + 14, cy + 1); pctx.lineTo(cx + 3, cy + 4); pctx.fill();
  pctx.fillStyle = isRainbow ? '#e17055' : darkenColor(skin.beak, 30);
  pctx.beginPath(); pctx.moveTo(cx + 3, cy + 4); pctx.lineTo(cx + 12, cy + 4); pctx.lineTo(cx + 3, cy + 7); pctx.fill();
}

// ============================================================
// INITIALIZATION
// ============================================================

loadSaveData();
resetGame();
gameLoop();

</script>
